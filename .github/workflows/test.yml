name: ArtMath pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: bash -n scripts/setup_cloud.sh
      - run: bash scripts/setup_cloud.sh
        env:
          ARTMATH_PYTHON: python
      - run: bash scripts/setup_cloud.sh
        env:
          ARTMATH_PYTHON: python
      - run: bash scripts/setup_cloud.sh --check
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python tools/story_editor.py --help
      - run: bash scripts/setup_cloud.sh --smoke-test
        env:
          ARTMATH_PYTHON: python
